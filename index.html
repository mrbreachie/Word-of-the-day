<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="A new English word every day." />
    <title>Word of the Day</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body>
    <!-- Intro screen: shown while the word loads, then slides away -->
    <div id="intro" aria-hidden="true">
      <p class="intro-date" id="intro-date"></p>
      <p class="intro-title" id="intro-title">Word of the Day</p>
      <div class="intro-bar"><span></span></div>
    </div>

    <main>
      <header class="page-header">
        <p class="eyebrow" id="today-date"></p>
        <h1>Word of the Day</h1>
      </header>

      <section id="word-card" aria-live="polite">
        <div class="card-top">
          <span class="part-of-speech" id="part-of-speech"></span>
          <span class="badge" id="badge"></span>
        </div>

        <h2 class="word" id="word"></h2>

        <div class="pronunciation-row">
          <span class="pronunciation" id="pronunciation"></span>
          <button class="audio-btn" id="audio-btn" type="button" aria-label="Listen to the word" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
              <path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span>Listen</span>
          </button>
        </div>

        <p class="definition" id="definition"></p>
        <p class="example" id="example"></p>

        <ul class="synonyms" id="synonyms"></ul>
      </section>

      <div class="actions">
        <button class="btn btn-primary" id="another-btn" type="button">Another word</button>
        <button class="btn" id="share-btn" type="button">Share</button>
      </div>

      <p class="countdown">A new word every day · <span id="word-count">0</span> words to discover</p>
    </main>

    <!-- Bump ?v= whenever these files change, so browsers fetch the new versions -->
    <script src="daily-word.js?v=2"></script>
    <script src="script.js?v=2"></script>
  </body>
</html>
