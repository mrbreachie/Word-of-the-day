name: Discord Word of the Day

on:
  schedule:
    # Midday in Melbourne. GitHub only uses UTC, and Melbourne's offset
    # changes with daylight saving, so we run at both possible times:
    #   01:00 UTC = 12:00 in summer (AEDT, UTC+11)
    #   02:00 UTC = 12:00 in winter (AEST, UTC+10)
    # The script checks Melbourne's clock and only posts during the
    # 12 o'clock hour, so just one of these posts each day.
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
  # Adds a "Run workflow" button on the Actions tab for testing
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post word to Discord
        run: node discord/post-word.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
